[tool.poetry]
name = "smt-diff-api"
version = "2.17.0"
description = "SMT Diff API for FM Playground"
authors = ["Soaibuzzaman <soaibuzzaman@uni-weimar.de>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = {extras = ["standard"], version = "^0.141.1"}
httpx = "^0.28.1"
requests = "^2.32.5"
uvicorn = "^0.37.0"
python-dotenv = "^1.0.1"
z3-solver = ">=5.1.0.0,<6.0.0.0"
# The smt-diff library is vendored for now. To fetch it from its repository instead,
# replace this line with e.g. {git = "https://github.com/<org>/smt-diff.git", tag = "v0.1.0"}
# and delete vendor/smt-diff.
smt-diff = {path = "vendor/smt-diff", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.12.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
